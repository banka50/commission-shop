{% extends "base.html" %}

{% block content %}
<h1>Категории товаров</h1>
<a href="{{ url_for('add_category') }}" class="btn btn-primary mb-3">
    <i class="fas fa-plus"></i> Добавить категорию
</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Название</th>
            <th>Описание</th>
            <th>Товаров</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for category in categories %}
        <tr>
            <td>{{ category.name }}</td>
            <td>{{ category.description or '' }}</td>
            <td>{{ category.products | length }}</td>
            <td>
                <a href="{{ url_for('edit_category', category_id=category.id) }}" class="btn btn-warning btn-sm">
                    <i class="fas fa-edit"></i> Редактировать
                </a>
                <form action="{{ url_for('delete_category', category_id=category.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('Удалить категорию?');">
                        <i class="fas fa-trash-alt"></i> Удалить
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
