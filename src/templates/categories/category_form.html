{% extends "base.html" %}

{% block content %}
<h1>{{ "Редактирование категории" if category else "Добавление категории" }}</h1>

<form method="POST">
    <div class="form-group">
        <label for="name">Название:</label>
        <input type="text" id="name" name="name" class="form-control" required
               value="{{ category.name if category else '' }}">
    </div>
    <div class="form-group">
        <label for="description">Описание:</label>
        <input type="text" id="description" name="description" class="form-control"
               value="{{ category.description if category else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">{{ "Сохранить" if category else "Добавить" }}</button>
    <a href="{{ url_for('categories_list') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
