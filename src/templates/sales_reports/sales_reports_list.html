{% extends "base.html" %}

{% block content %}
<h1>Отчёты по продажам</h1>
<a href="{{ url_for('add_sales_report') }}" class="btn btn-primary mb-3">
    <i class="fas fa-plus"></i> Добавить отчёт
</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Номер</th>
            <th>Дата</th>
            <th>Тип</th>
            <th>Описание</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for sr in sales_reports %}
        <tr>
            <td>{{ sr.number }}</td>
            <td>{{ sr.date }}</td>
            <td>{{ sr.report_type }}</td>
            <td>{{ sr.description }}</td>
            <td>
                <a href="{{ url_for('sales_report_detail', sales_report_id=sr.id) }}" class="btn btn-primary btn-sm">
                    <i class="fas fa-eye"></i> Показать
                </a>
                <a href="{{ url_for('edit_sales_report', sales_report_id=sr.id) }}" class="btn btn-warning btn-sm">
                    <i class="fas fa-edit"></i> Редактировать
                </a>
                <form action="{{ url_for('delete_sales_report', sales_report_id=sr.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Вы уверены, что хотите удалить отчёт?');">
                        <i class="fas fa-trash-alt"></i> Удалить
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
